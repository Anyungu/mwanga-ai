services:
  # 0. Edge Reverse Proxy & TLS Termination
  caddy:
    build: ./caddy
    container_name: mwanga_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core
      - admin-ui

  # 0.1. High-Performance In-Memory Cache & Rate Limiter
  redis:
    image: redis:alpine
    container_name: mwanga_redis
    restart: unless-stopped
    env_file: ./env/redis.env
    command: >
      sh -c 'redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data

  # 1. PostgreSQL 18 with pgvector extension (lightweight alpine build)
  db:
    image: pgvector/pgvector:0.8.0-pg18-alpine
    container_name: irc_vector_db
    env_file: ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Local Open-Weight Model Runner
  ollama:
    image: ollama/ollama:latest
    container_name: irc_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 2.1. Pull embedding model once Ollama is ready
  ollama-init:
    image: ollama/ollama:latest
    container_name: irc_ollama_init
    env_file: ./env/ollama-init.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
    depends_on:
      - ollama
    restart: "no"

  # 3. FastAPI AI Gateway & MCP Server
  core:
    build: ./core
    container_name: irc_ai_gateway
    env_file: ./env/core.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  # 4. TanStack Start Admin UI
  admin-ui:
    build: ./admin-ui
    container_name: irc_admin_ui
    ports:
      - "3000:3000"
    env_file: ./env/admin-ui.env
    depends_on:
      - core

  # 5. Prometheus Metrics (Lightweight Alpine)
  prometheus:
    image: prom/prometheus:alpine
    container_name: irc_prometheus
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # 6. Grafana Visual Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: irc_grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
